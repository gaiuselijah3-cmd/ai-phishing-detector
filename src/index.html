<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Phishing Email Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease-in-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card {
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .result-card.phishing {
            background: #fee;
            border-left: 4px solid #f44336;
        }

        .result-card.safe {
            background: #efe;
            border-left: 4px solid #4caf50;
        }

        .result-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .result-card.phishing .result-title {
            color: #d32f2f;
        }

        .result-card.safe .result-title {
            color: #388e3c;
        }

        .confidence-bar {
            height: 8px;
            background: #ddd;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .confidence-fill {
            height: 100%;
            transition: width 0.5s ease-in-out;
        }

        .result-card.phishing .confidence-fill {
            background: #f44336;
        }

        .result-card.safe .confidence-fill {
            background: #4caf50;
        }

        .confidence-text {
            font-size: 14px;
            margin-top: 8px;
            color: #555;
        }

        .confidence-text strong {
            font-size: 18px;
        }

        .error {
            background: #fee;
            border-left: 4px solid #f44336;
            color: #d32f2f;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 AI Phishing Detector</h1>
        <p class="subtitle">Paste an email and detect if it's phishing or safe</p>

        <div class="form-group">
            <label for="emailText">Email Text:</label>
            <textarea id="emailText" placeholder="Paste the email content here..."></textarea>
        </div>

        <button onclick="analyzeEmail()" id="analyzeBtn">Analyze Email</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing email...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="result-card" id="resultCard">
                <div class="result-title" id="resultTitle"></div>
                <div class="confidence-bar">
                    <div class="confidence-fill" id="confidenceFill"></div>
                </div>
                <div class="confidence-text">
                    Confidence: <strong id="confidence"></strong>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function analyzeEmail() {
            const emailText = document.getElementById('emailText').value.trim();
            const error = document.getElementById('error');
            const result = document.getElementById('result');
            const loading = document.getElementById('loading');

            // Clear previous states
            error.classList.remove('show');
            result.classList.remove('show');

            if (!emailText) {
                error.textContent = 'Please paste an email to analyze';
                error.classList.add('show');
                return;
            }

            loading.classList.add('show');
            document.getElementById('analyzeBtn').disabled = true;

            try {
                const response = await fetch('http://127.0.0.1:5000/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email_text: emailText })
                });

                if (!response.ok) {
                    throw new Error('Failed to analyze email');
                }

                const data = await response.json();

                // Update result
                const resultCard = document.getElementById('resultCard');
                const resultTitle = document.getElementById('resultTitle');
                const confidenceFill = document.getElementById('confidenceFill');
                const confidence = document.getElementById('confidence');

                const isPhishing = data.is_phishing;
                const confidencePercent = Math.round(data.confidence * 100);

                if (isPhishing) {
                    resultCard.classList.remove('safe');
                    resultCard.classList.add('phishing');
                    resultTitle.textContent = '⚠️ Phishing Email Detected';
                } else {
                    resultCard.classList.remove('phishing');
                    resultCard.classList.add('safe');
                    resultTitle.textContent = '✅ Email is Safe';
                }

                confidenceFill.style.width = confidencePercent + '%';
                confidence.textContent = confidencePercent + '%';

                result.classList.add('show');
            } catch (err) {
                error.textContent = 'Error: ' + err.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
                document.getElementById('analyzeBtn').disabled = false;
            }
        }

        // Allow Enter key to submit
        document.getElementById('emailText').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                analyzeEmail();
            }
        });
    </script>
</body>
</html>
